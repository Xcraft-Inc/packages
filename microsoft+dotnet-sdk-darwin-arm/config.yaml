name: microsoft+dotnet-sdk-darwin-arm
version: 29.0.0
$version: 29.0.0
distribution: toolchain/
maintainer:
  name: Mathieu Schroeter
  email: schroeter@epsitec.ch
architecture:
  - darwin-aarch64
description:
  brief: .NET Core SDK 8.0, 10.0 and 11.0
  long: ''
dependency:
  install:
    xcraft+peon:
      - version: ''
        architecture: []
    bagder+curl:
      - version: ''
        architecture: []
  make:
    xcraft+utils:
      - version: ''
        architecture: []
    microsoft+dotnet-sdk-80-darwin-arm:
      - version: ''
        architecture:
          - darwin-aarch64
    microsoft+dotnet-sdk-100-darwin-arm:
      - version: ''
        architecture:
          - darwin-aarch64
    microsoft+dotnet-sdk-110-darwin-arm:
      - version: ''
        architecture:
          - darwin-aarch64
bump: []
data:
  get:
    uri: ''
    mirrors: []
    ref: ''
    $ref: ''
    out: ''
    externals: false
  type: bin
  configure: |-
    mkdir('root/opt/dotnet-sdk/bin');
    /* DYLD_LIBRARY_PATH is disabled to prevent libunwind bugs */
    yield exec(
      'writefile',
      '#!/bin/sh\n#export DYLD_LIBRARY_PATH=/usr/lib:${LIBRARY_PATH}\n"$(dirname "$0")/../dotnet" "$@"\n',
      'root/opt/dotnet-sdk/bin/dotnet'
    );
    yield exec('chmod', 'a+x', 'root/opt/dotnet-sdk/bin/dotnet');
    cp('<PEON.ROOTDIR>/usr/share/microsoft/dotnet-sdk-80-darwin-arm/cache/data', 'root/opt/dotnet-sdk');
    cp('<PEON.ROOTDIR>/usr/share/microsoft/dotnet-sdk-100-darwin-arm/cache/data', 'root/opt/dotnet-sdk');
    cp('<PEON.ROOTDIR>/usr/share/microsoft/dotnet-sdk-110-darwin-arm/cache/data', 'root/opt/dotnet-sdk');
  rules:
    type: move
    location: root
    args:
      postinst: ''
      prerm: ''
    env: {}
  env:
    path:
      - opt/dotnet-sdk/bin
    other:
      DOTNET_ROOT: <OS.ROOTDIR>/opt/dotnet-sdk
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MSBUILDDISABLENODEREUSE: '1'
      NUGET_EXE_NO_PROMPT: '1'
      NUGET_PACKAGES: <OS.ROOTTEMP>/nuget
  embedded: true
