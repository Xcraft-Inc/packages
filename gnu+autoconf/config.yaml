subpackage:
  - runtime*
name: gnu+autoconf
version: '2.72'
$version: '2.72'
distribution: toolchain/
maintainer:
  name: Mathieu Schroeter
  email: schroeter@epsitec.ch
architecture:
  - source
description:
  brief: GNU autoconf
  long: ''
dependency:
  install:
    gnu+m4:
      - version: ''
        architecture: []
  build:
    xcraft+base-build:
      - version: ''
        architecture: []
bump: []
data:
  get:
    uri: 'https://ftpmirror.gnu.org/autoconf/autoconf-<THIS.$VERSION>.tar.gz'
    mirrors:
      - 'https://ftp.gnu.org/gnu/autoconf/autoconf-<THIS.$VERSION>.tar.gz'
    ref: ''
    $ref: ''
    out: ''
    externals: true
    prepare: ''
    $hash: 2.72@afb181a76e1ee72832f6581c0eddf8df032b83e2e0239ef79ebedc4467d92d6e.tar.gz
  type: src
  configure: '!cd <THIS.DATA.RULES.LOCATION> && ./configure --prefix=<PEON.PREFIXDIR>'
  rules:
    type: make
    location: data/autoconf-<THIS.$VERSION>
    args:
      postinst: ''
      prerm: ''
      makeall: '-j<PEON.CPUS.COUNT>'
      maketest: ''
      makeinstall: install
    test: none
    env: {}
  deploy: rm ('<PEON.PREFIXDIR>/share/info/dir');
  env:
    path: []
    other:
      AUTOCONF: <OS.ROOTDIR>/usr/bin/autoconf
      AUTOHEADER: <OS.ROOTDIR>/usr/bin/autoheader
      AUTOM4TE: <OS.ROOTDIR>/usr/bin/autom4te
      autom4te_perllibdir: <OS.ROOTDIR>/usr/share/autoconf
      AC_MACRODIR: <OS.ROOTDIR>/usr/share/autoconf
  embedded: true
  runtime:
    configure: ''
