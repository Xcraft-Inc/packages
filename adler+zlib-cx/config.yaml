subpackage:
  - runtime*
  - dev
name: adler+zlib-cx
version: 1.3.1
$version: 1.3.1
distribution: monolith/
maintainer:
  name: Mathieu Schroeter
  email: schroeter@epsitec.ch
architecture:
  - source
description:
  brief: A Massively Spiffy Yet Delicately Unobtrusive Compression Library
  long: ''
dependency:
  install:
    adler+zlib-cx:
      - version: ''
        architecture: []
        subpackage:
          - dev
  build:
    xcraft+peon:
      - version: ''
        architecture: []
    gnu+make:
      - version: ''
        architecture:
          - linux-i386
          - linux-amd64
          - linux-aarch64
          - darwin-i386
          - darwin-amd64
          - darwin-aarch64
          - solaris-i386
          - solaris-amd64
          - freebsd-i386
          - freebsd-amd64
bump: []
data:
  get:
    uri: 'https://zlib.net/fossils/zlib-<THIS.$VERSION>.tar.gz'
    mirrors: []
    ref: ''
    $ref: ''
    out: ''
    externals: true
    prepare: ''
    $hash: 1.3.1@9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23.tar.gz
  type: src
  configure: |-
    !<PEON.OS=win? exit 0; :>
    cd <THIS.DATA.RULES.LOCATION>
      && ./configure --prefix=<PEON.PREFIXDIR>/local
                     --libdir=<PEON.PREFIXDIR.DEV>/local/lib
                     --includedir=<PEON.PREFIXDIR.DEV>/local/include
                     --static
  rules:
    type: script
    location: data/zlib-<THIS.$VERSION>
    args:
      postinst: ''
      prerm: ''
      makeall: '!make <PEON.OS=win? -f win32/Makefile.gcc : -j{PEON.CPUS.COUNT}>'
      maketest: ''
      makeinstall: |-
        !make BINARY_PATH=<PEON.PREFIXDIR>/local/bin
              INCLUDE_PATH=<PEON.PREFIXDIR.DEV>/local/include
              LIBRARY_PATH=<PEON.PREFIXDIR.DEV>/local/lib
        <PEON.OS=win?
              SHARED_MODE=0
              -f win32/Makefile.gcc
        :>    install
    test: none
    env:
      cc: <PEON.ENV.CC>
      CFLAGS: <PEON.ENV.CFLAGS> -Os
      darwin-amd64/SDKROOT: <PEON.ENV.MACOSSDK_1013>
      darwin-amd64/MACOSX_DEPLOYMENT_TARGET: 10.13
      darwin-aarch64/CC: clang -arch x86_64 -m64
  deploy: |-
    mkdir("<PEON.PREFIXDIR>/local/lib");
    try { /* lib/ is not defined with pure --shared build */
      mv("<PEON.PREFIXDIR.DEV>/local/lib", "<PEON.PREFIXDIR>/local/lib", /.*[.](so|dylib).*/);
    } catch (ex) {}
  env:
    path: []
    other: {}
  embedded: true
  runtime:
    configure: ''
