subpackage:
  - runtime*
  - 'x+bin:linux-aarch64'
  - 'x+www:all'
name: carnotzet+contelia-rpi64
version: 0.10.1
$version: 0.10.1
distribution: raspberry/
maintainer:
  name: Mathieu Schroeter
  email: schroeter@epsitec.ch
architecture:
  - source
description:
  brief: Contelia service and website
  long: ''
dependency:
  install:
    vlasenko+busybox-rpi64-x+httpd:
      - version: ''
        architecture: []
        subpackage:
          - x+bin
    stedolan+jq-rpi64-x+bin:
      - version: ''
        architecture: []
        subpackage:
          - x+bin
    stedolan+jq-rpi64:
      - version: ''
        architecture: []
    alsa+lib-rpi64-x+bin:
      - version: ''
        architecture: []
        subpackage:
          - x+bin
    alsa+lib-rpi64:
      - version: ''
        architecture: []
    alsa+ucm-conf-rpi64-x+bin:
      - version: ''
        architecture: []
        subpackage:
          - x+bin
    alsa+ucm-conf-rpi64:
      - version: ''
        architecture: []
    infozip+zip-rpi64-x+bin:
      - version: ''
        architecture: []
        subpackage:
          - x+bin
    infozip+zip-rpi64:
      - version: ''
        architecture: []
  build:
    xcraft+base-build:
      - version: ''
        architecture: []
    rustlang+rust:
      - version: ''
        architecture: []
    x-aarch64-linux+gnu-gcc-glibc-cross:
      - version: ''
        architecture: []
  make:
    xcraft+base-make:
      - version: ''
        architecture: []
bump:
  - carnotzet+os-base-contelia-rpiz2w
data:
  get:
    uri: 'https://github.com/Skywalker13/contelia.git'
    mirrors: []
    ref: v<THIS.$VERSION>
    $ref: ''
    out: ''
    externals: false
    prepare: ''
  type: src
  configure: ''
  rules:
    type: script
    location: data
    args:
      postinst: ''
      prerm: ''
      makeall: |-
        !  make build TARGET=aarch64-unknown-linux-gnu
        && aarch64-xcraft-linux-gnu-gcc -o contelia_upgrade <PEON.ASSETS>/contelia_upgrade.c
      maketest: ''
      makeinstall: |-
        !  make install-bin DESTDIR=<PEON.INSTALLDIR.X+BIN> PREFIX=/usr TARGET=aarch64-unknown-linux-gnu
        && make install-www DESTDIR=<PEON.INSTALLDIR.X+BIN>
        && install -D -m 4755 contelia_upgrade <PEON.PREFIXDIR.X+BIN>/bin/contelia_upgrade
    test: none
    env:
      RUSTFLAGS: <PEON.ENV.RUSTFLAGS> -C linker=aarch64-xcraft-linux-gnu-gcc
      PKG_CONFIG_ALLOW_CROSS: '1'
      PKG_CONFIG_PATH: <PEON.PROD.ROOTDIR>/usr/lib/pkgconfig
      PKG_CONFIG_SYSROOT_DIR: <PEON.PROD.ROOTDIR>
  deploy: |-
    /* User's books */
    mkdir('<PEON.INSTALLDIR.X+BIN>/var/lib/contelia');

    /* Captive Portal */
    mkdir('<PEON.INSTALLDIR.X+BIN>/var/httpd/www');
    ln('../../../var/lib/contelia', '<PEON.INSTALLDIR.X+BIN>/var/httpd/www/contelia');
    cp('<PEON.ASSETS>/index.html',  '<PEON.INSTALLDIR.X+BIN>/var/httpd/www/index.html');

    /* Service */
    mkdir('<PEON.INSTALLDIR.X+BIN>/var/log/contelia');
    cp('<PEON.ASSETS>/sv',       '<PEON.INSTALLDIR.X+BIN>/etc/sv/contelia');
    cp('<PEON.ASSETS>/postinst', '<PEON.INSTALLDIR.X+BIN>/WPKG/postinst');
    cp('<PEON.ASSETS>/prerm',    '<PEON.INSTALLDIR.X+BIN>/WPKG/prerm');

    /* Special command to upgrade contelia */
    cp('<PEON.ASSETS>/contelia_upgrade.sh', '<PEON.PREFIXDIR.X+BIN>/bin/contelia_upgrade.sh');

    /* Website contelia.schroetersa.ch */
    cp('<THIS.DATA.RULES.LOCATION>/doc/_site', '<PEON.INSTALLDIR.X+WWW>/var/httpd/www');
  env:
    path: []
    other: {}
  embedded: true
  runtime:
    configure: ''
